name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - name: Валидация каталога
        run: dotnet run -c Release --no-build --project src/WizardOS.Cli -- validate --catalog catalog
      - name: Publish (self-contained single-file, D-027)
        run: dotnet publish src/WizardOS.Cli -c Release -r win-x64 -o publish
      - name: Smoke-тест exe
        run: ./publish/wizardos.exe validate --catalog catalog
      - uses: actions/upload-artifact@v4
        with:
          name: wizardos-win-x64
          path: publish/wizardos.exe
