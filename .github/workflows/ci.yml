name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - name: Валидация каталога
        run: dotnet run -c Release --no-build --project src/BareOS.Cli -- validate --catalog catalog
      - name: Publish (self-contained single-file, D-027)
        run: dotnet publish src/BareOS.Cli -c Release -r win-x64 -o publish
      - name: Smoke-тест exe
        run: ./publish/bareos.exe validate --catalog catalog
      - name: Publish Toolbox (WPF, self-contained single-file)
        run: dotnet publish src/BareOS.Toolbox -c Release -r win-x64 -o publish-toolbox
      - name: Сборка .apbx (плейбук + движок + Toolbox)
        env:
          PYTHONUTF8: '1'
        run: python tools/package.py --exe publish/bareos.exe --toolbox publish-toolbox/BareOS-Toolbox.exe --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: bareos-win-x64
          path: publish/bareos.exe
      - uses: actions/upload-artifact@v4
        with:
          name: bareos-toolbox-win-x64
          path: publish-toolbox/BareOS-Toolbox.exe
      - uses: actions/upload-artifact@v4
        with:
          name: bareos-playbook-apbx
          path: dist/*
