name: lint
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  catalog-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install check-jsonschema==0.29.4
      - name: Карточки каталога по tweak.schema.json
        run: check-jsonschema --schemafile catalog/tweak.schema.json catalog/*.yml
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (C#, секреты, GitHub Actions)
        run: semgrep scan --error --metrics=off --config p/csharp --config p/secrets --config p/github-actions --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag .
