id: consumer.content-delivery
title: "Без тихой установки рекламных приложений и советов Windows (Content Delivery Manager)"
verdict: Standard
stability: Moderate
category: privacy
scope: user
risk: T1
status: accepted
source: "Разбор AtlasOS и ReviOS (playbook), 2026-11-12"
intent: "Content Delivery Manager текущего пользователя: не ставить предложенные и OEM-приложения (Candy Crush и т.п.), не показывать советы, предложения в Параметрах и Пуске, экран приветствия после обновлений, факты на экране блокировки."
evidence: "Значения ContentDeliveryManager SilentInstalledAppsEnabled, PreInstalledAppsEnabled, OemPreInstalledAppsEnabled, ContentDeliveryAllowed, SubscribedContentEnabled, SystemPaneSuggestionsEnabled, SoftLandingEnabled, SubscribedContent-310093/338387/338388/338389/338393/353694/353696Enabled = 0 (verify); на чистой установке после первого входа в Пуске нет автоматически установленных игр, число Appx не растёт (Proof Report)."
reversibility: "revert по baseline: значения возвращаются к исходным или удаляются"
breaks: "Нет советов и «интересных фактов» на экране блокировки; Spotlight настраивается отдельно (shell.lockscreen-spotlight)."
actions:
  - id: contentdeliveryallowed
    registry:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
      name: ContentDeliveryAllowed
      kind: DWord
      data: "0"
  - id: subscribedcontentenabled
