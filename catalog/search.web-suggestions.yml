id: search.web-suggestions
title: "Веб-поиск и динамическое содержимое в поиске выключены"
verdict: Standard
stability: Stable
category: convenience
scope: machine
risk: T1
status: accepted
intent: "Убрать Bing-подсказки из поиска меню «Пуск» и динамические «Основные моменты поиска»."
evidence: "Политики HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Explorer: DisableSearchBoxSuggestions = 1 и HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Windows Search: EnableDynamicContentInWSB = 0; запрос в поиске не создаёт обращений к bing.com (замер сетевых соединений SearchHost)."
reversibility: "revert по baseline: значение возвращается к исходному или удаляется"
actions:
  - id: disable-search-box-suggestions
    registry:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Explorer'
      name: DisableSearchBoxSuggestions
      kind: DWord
      data: "1"
  - id: disable-dynamic-content
    registry:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
      name: EnableDynamicContentInWSB
      kind: DWord
      data: "0"
