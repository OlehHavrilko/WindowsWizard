id: search.web-suggestions
title: "«Основные моменты поиска» (динамическое содержимое) выключены"
verdict: Standard
stability: Stable
category: convenience
scope: machine
risk: T1
status: accepted
intent: "Убрать из поиска меню «Пуск» динамические «Основные моменты поиска» (контент Bing)."
evidence: "Политика HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Windows Search: EnableDynamicContentInWSB = 0; в панели поиска нет блока «Основные моменты», SearchHost не загружает его контент (замер сетевых соединений)."
reversibility: "revert по baseline: значение возвращается к исходному или удаляется"
breaks: "Аудит 2026-11-11: действие DisableSearchBoxSuggestions убрано — политика только пользовательская, в HKLM не действует; вернётся с scope user."
actions:
  - id: disable-dynamic-content
    registry:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
      name: EnableDynamicContentInWSB
      kind: DWord
      data: "0"
