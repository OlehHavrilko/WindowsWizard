id: privacy.advertising-id
title: "Рекламный идентификатор выключен"
verdict: Core
stability: Stable
category: privacy
scope: machine
risk: T1
status: accepted
intent: "Запретить приложениям использовать рекламный идентификатор для персонализированной рекламы."
evidence: "Политика HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\AdvertisingInfo: DisabledByGroupPolicy = 1; значение HKCU\\...\\AdvertisingInfo\\Enabled = 0 после входа."
reversibility: "revert по baseline: значение возвращается к исходному или удаляется"
actions:
  - id: disabled-by-group-policy
    registry:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AdvertisingInfo'
      name: DisabledByGroupPolicy
      kind: DWord
      data: "1"
