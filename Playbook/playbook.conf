<?xml version="1.0" encoding="utf-8"?>
<Playbook>
  <Name>Bare OS</Name>
  <Username>OlehHavrilko</Username>
  <UniqueId>ffeab6fe-1e87-4d06-930f-06f0fdb62bd5</UniqueId>
  <ShortDescription>Декларативные изменения Windows 11 с проверкой и откатом</ShortDescription>
  <Title>Bare OS</Title>
  <Description>Применяет набор параметров приватности и оболочки Windows 11 через движок bareos: снимает исходное состояние, применяет изменения, проверяет результат и пишет отчёт. Defender, Windows Update, WSL2 и Hyper-V не затрагиваются.</Description>
  <Details>Версия 0.1: только официальные политики и задачи телеметрии. Откат: bareos revert (снимок исходного состояния в %ProgramData%\BareOS\runs).</Details>
  <Version>0.1</Version>
  <SupportedBuilds>
    <string>26300</string>
  </SupportedBuilds>
  <Requirements>
    <Requirement>NoPendingUpdates</Requirement>
  </Requirements>
  <ProgressText>Применяются параметры Bare OS и проверяется результат</ProgressText>
  <Git>https://github.com/OlehHavrilko/WindowsWizard/</Git>
</Playbook>
