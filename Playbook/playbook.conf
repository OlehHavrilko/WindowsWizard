<?xml version="1.0" encoding="utf-8"?>
<Playbook>
  <Name>Bare OS</Name>
  <Username>OlehHavrilko</Username>
  <UniqueId>ffeab6fe-1e87-4d06-930f-06f0fdb62bd5</UniqueId>
  <ShortDescription>Декларативные изменения Windows 11 с проверкой и откатом</ShortDescription>
  <Title>Bare OS</Title>
  <Description>Убирает с Windows 11 предустановленный мусор (Copilot, виджеты, погода и новости, рекламные приложения), рекламу в Пуске, поиске и на экране блокировки, лишние службы и фоновые задачи, настраивает Edge и производительность. До и после делает замер и показывает Proof Report: что изменилось на самом деле. Defender, Windows Update, Store, WSL2 и Hyper-V не затрагиваются.</Description>
  <Details>Версия 0.2: 45 карточек (политики, службы, задачи, удаление Appx). Удалённые приложения откатом не восстанавливаются (вернуть из Microsoft Store). Остальное: bareos revert (снимок в %ProgramData%\BareOS\runs). Proof Report: %ProgramData%\BareOS\proof\proof.html.</Details>
  <Version>0.2</Version>
  <SupportedBuilds>
    <string>26300</string>
  </SupportedBuilds>
  <Requirements>
    <Requirement>NoPendingUpdates</Requirement>
  </Requirements>
  <ProgressText>Применяются параметры Bare OS и проверяется результат</ProgressText>
  <Git>https://github.com/OlehHavrilko/WindowsWizard/</Git>
</Playbook>
